[project]
name = "talon"
version = "1.6.0"
description = "Mailgun library to extract message quotations and signatures"
readme = "README.rst"
requires-python = ">=3.10,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Mailgun Inc.", email = "admin@mailgunhq.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "lxml>=2.3.3",
    "regex>=1",
    "numpy",
    "scipy",
    "scikit-learn>=1.0.0",
    "chardet>=1.0.1",
    "cssselect",
    "html5lib",
    "joblib",
]

[project.urls]
Homepage = "https://github.com/mailgun/talon"
Documentation = "https://github.com/mailgun/talon#readme"
Repository = "https://github.com/mailgun/talon"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talon"]

[tool.hatch.build.targets.wheel.sources]
"talon" = "talon"

# Include classifier data files in package
[tool.hatch.build.targets.sdist]
include = [
    "talon/**/*.py",
    "talon/signature/data/*",
]

[tool.hatch.build.targets.wheel.force-include]
"talon/signature/data" = "talon/signature/data"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff",
    "ty",
    "google-genai>=1.59.0",
    "python-dotenv>=1.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=talon --cov-report=xml --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
extend-select = [
    "F",    # Pyflakes rules
    "W",    # PyCodeStyle warnings
    "E",    # PyCodeStyle errors
    "I",    # Sort imports properly
    "B",    # flake8-bugbear
    "UP",   # Warn if certain things can be changed due to newer Python versions
    "C4",   # Catch incorrect use of comprehensions, dict, list, etc
    "FA",   # Enforce from __future__ import annotations
    "ISC",  # Good use of string concatenation
    "ICN",  # Use common import conventions
    "RET",  # Good return practices
    "SIM",  # Common simplification rules
    "TID",  # Some good import practices
    "TC",   # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",  # Use pathlib instead of os.path
    "TD",   # Be diligent with TODO comments
    "NPY",  # Some numpy-specific things
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ty.environment]
python-version = "3.12"
